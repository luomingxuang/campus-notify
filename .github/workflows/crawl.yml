name: 校园通知抓取

# 每 2 小时跑一轮（cron 为 UTC，2 小时边界与北京时间对齐）
# 免费额度：公开仓库标准 runner 完全免费；私有仓库 Free 计划 2000 分钟/月
# 本任务单轮约 2-4 分钟 → 私有仓库约 900-1400 分钟/月（估算）
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:          # 支持网页上手动点一下立即运行
    inputs:
      limit:
        description: '每站最多抓几篇（留空=默认 6 篇；填 1 可快速验证跑通）'
        required: false
        default: ''

permissions:
  contents: write             # 需要把状态快照提交回仓库（去重靠它）

concurrency:
  group: campus-notify
  cancel-in-progress: false   # 上一轮没跑完就排队，避免并发导致重复推送

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 环境自检
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          echo "### 环境自检" >> $GITHUB_STEP_SUMMARY
          if [ -n "$LLM_API_KEY" ]; then
            echo "- 摘要密钥：已配置" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 摘要密钥：**缺失**（本轮只抓取，摘要留空）" >> $GITHUB_STEP_SUMMARY
            echo "::warning title=未配置摘要密钥::Settings → Secrets 里没有 LLM_API_KEY"
          fi
          if [ -n "$SERVERCHAN_SENDKEY" ]; then
            echo "- 推送密钥：已配置" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 推送密钥：**缺失**（抓到了也不会推微信）" >> $GITHUB_STEP_SUMMARY
            echo "::warning title=未配置推送密钥::Settings → Secrets 里没有 SERVERCHAN_SENDKEY"
          fi

      # 海外节点能否访问学校官网是这条路线唯一的不确定项，单独测一次留在日志里
      - name: 连通性预检
        run: |
          echo "### 学校官网连通性" >> $GITHUB_STEP_SUMMARY
          echo "| 站点 | 响应码 | 耗时 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for u in "https://www.hafu.edu.cn/index/ggtz.htm" "https://jwc.hafu.edu.cn/" "https://xsc.hafu.edu.cn/" "https://www.hafu.edu.cn/"; do
            r=$(curl -s -m 15 -o /dev/null -w "%{http_code}|%{time_total}" "$u" 2>/dev/null || echo "FAIL|0")
            echo "| $u | ${r%%|*} | ${r##*|}s |" >> $GITHUB_STEP_SUMMARY
          done

      - name: 抓取并生成摘要
        env:
          TZ: Asia/Shanghai
          STATE_BACKEND: local
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
          MAX_ARTICLES_PER_SITE: '6'
          MAX_ARTICLE_AGE_DAYS: '120'
          # 推送：daily 模式 = 每天一条汇总，到点后才推
          PUSH_CHANNEL: ${{ vars.PUSH_CHANNEL || 'serverchan' }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSH_MODE: ${{ vars.PUSH_MODE || 'daily' }}
          PUSH_DAILY_HOUR: ${{ vars.PUSH_DAILY_HOUR || '20' }}
          PUSH_MAX_AGE_DAYS: '7'
          # 站点导出到 docs/，后续可直接作为 GitHub Pages 发布源
          SITE_DIR: 'docs'
          SITE_PUBLIC_URL: ${{ vars.SITE_PUBLIC_URL }}
          SITE_SHARE_CODE: ${{ vars.SITE_SHARE_CODE }}
        run: |
          python main.py ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }}

      - name: 提交状态快照
        run: |
          git config user.name "campus-notify-bot"
          git config user.email "campus-notify-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "本轮无变化，跳过提交"
          else
            git commit -m "状态更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
            echo "已提交状态快照与站点"
          fi

      - name: 输出本轮摘要
        if: always()
        run: |
          if [ -f data/outputs/最新通知摘要.md ]; then
            head -40 "data/outputs/最新通知摘要.md"
          fi
          echo "站点入口：${{ vars.SITE_PUBLIC_URL }}"

      # 静默失败最坑：抓不到、推不出，你完全不知道
      - name: 失败告警
        if: failure()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          if [ -n "$SERVERCHAN_SENDKEY" ]; then
            curl -s -m 15 "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
              --data-urlencode "title=校园通知抓取失败" \
              --data-urlencode "desp=GitHub Actions 本轮执行失败，请到仓库 Actions 页面查看日志。运行编号：${{ github.run_number }}" > /dev/null
            echo "已发送失败告警"
          else
            echo "未配置推送密钥，跳过失败告警"
          fi
